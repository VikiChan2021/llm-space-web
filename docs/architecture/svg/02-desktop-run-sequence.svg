<text x="60" y="58" font-size="28" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">02  一次 Desktop Run 的时序</text>
<text x="60" y="92" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">时间从上往下；图中画单个模型回合。多回合工具循环在图 04。</text>
<rect x="157" y="254" width="366" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="160" y="271" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-1">1  streamThread：转换后的 request + connection</text>
<rect x="407" y="324" width="390" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="410" y="341" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-2">2  sendStreamThreadRequest：runtimeId + streamId</text>
<rect x="657" y="394" width="288" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="660" y="411" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-3">3  forwardStreamThread / getRuntime</text>
<rect x="907" y="464" width="306" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="910" y="481" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-4">4  StreamThreadController：解析模型连接</text>
<rect x="1157" y="534" width="398" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="1160" y="551" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-5">5  models.streamSimple：Prompt / messages / tools</text>
<rect x="1157" y="604" width="116" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="1160" y="621" font-size="14" fill="#9333ea" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-6">6  流式模型输出</text>
<rect x="907" y="674" width="112" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="910" y="691" font-size="14" fill="#9333ea" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-7">7  AgentEvent</text>
<rect x="657" y="744" width="304" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="660" y="761" font-size="14" fill="#9333ea" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-8">8  { streamId, event / done / error }</text>
<rect x="407" y="814" width="248" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="410" y="831" font-size="14" fill="#9333ea" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-9">9  receiveStreamThreadResponse</text>
<rect x="157" y="884" width="332" height="23" fill="#ffffff" data-graph-role="decoration"/>
<text x="160" y="901" font-size="14" fill="#9333ea" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-10">10  AsyncIterable → reduceMessages → UI</text>
<text x="60" y="966" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">开始：idle → preparing（校验与模板渲染）→ running。结束：取消节流任务、结算结果与历史，再回到 idle。</text>
<text x="60" y="1000" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">停止：AbortSignal → abortStreamThread(streamId) → RuntimeClient.abortStream → Controller AbortController。</text>
<text x="60" y="1052" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">只有已收到事件、未失败且未中止的运行才写普通 Run history；失败 / 中止不伪装成成功快照。</text>
<text x="102" y="1098" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">请求 / 主流程</text>
<text x="392" y="1098" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">事件 / 结果 / 循环</text>
<text x="732" y="1098" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">持久化 / 读取</text>
<text x="1052" y="1098" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">检查 / 中止 / 边界</text>
<text x="1540" y="58" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" data-graph-role="label">2026-09-03</text>
