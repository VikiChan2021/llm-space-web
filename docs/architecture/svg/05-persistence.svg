<text x="60" y="58" font-size="28" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">05  Thread、快照与存储边界</text>
<text x="60" y="92" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">区分可编辑内容、派生运行快照、瞬时 UI 状态，以及游客与身份服务各自的数据。</text>
<text x="62" y="167" font-size="17" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">Desktop / Remote：各自的 LLM_SPACE_HOME</text>
<text x="500.0" y="258.0" font-size="14" fill="#16a34a" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-1">Thread</text>
<text x="759.0" y="400.0" font-size="14" fill="#16a34a" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-2">规范化 Thread JSON</text>
<text x="500" y="518" font-size="14" fill="#16a34a" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-3">snapshotRef</text>
<text x="1042" y="167" font-size="17" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">其他持久化域</text>
<text x="60" y="865" font-size="16" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">文件复制 cp：复制并重新关联历史；移动 mv：历史随 resourceKey 重键；写入时 prune 清除不再引用的快照。</text>
<text x="60" y="910" font-size="16" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">删除 Thread：历史不会立即删除。maintain 首次发现资源缺失时记录 orphanedAt，超过 30 天保留期后回收。</text>
<text x="60" y="955" font-size="16" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Run history：保存成功完成的运行。changeHistory：为编辑与 Undo / Redo 服务。Trace：用于查看运行与工具证据。</text>
<text x="60" y="1000" font-size="16" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">保存快照与保存 Thread 属于不同阶段；请以各层错误处理为准，不把多文件操作描述成跨文件数据库事务。</text>
<text x="60" y="1092" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">一份 Thread 内容可以复用；数据归属始终跟随 runtime、浏览器来源或租户边界。</text>
<text x="102" y="1138" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">请求 / 主流程</text>
<text x="392" y="1138" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">事件 / 结果 / 循环</text>
<text x="732" y="1138" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">持久化 / 读取</text>
<text x="1052" y="1138" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">检查 / 中止 / 边界</text>
<text x="1540" y="58" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" data-graph-role="label">2026-09-03</text>
</svg>