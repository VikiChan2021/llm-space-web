<text x="60" y="58" font-size="28" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">03  Guest Web 的数据流</text>
<text x="60" y="92" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">顺着蓝色请求向右，再沿紫色结果向左；浏览器状态与服务端额度分别持久化。</text>
