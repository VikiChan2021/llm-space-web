<text x="726" y="372" font-size="14" fill="#16a34a" font-weight="400" text-anchor="end" data-graph-role="label" data-owner="edge-6">guestId / IP</text>
<text x="864" y="372" font-size="14" fill="#16a34a" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-7">额度决策</text>
<text x="274.0" y="722.5" font-size="14" fill="#16a34a" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-8">Thread JSON</text>
<text x="610" y="785" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">额度在开始模型流之前消耗。</text>
<text x="610" y="822" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">计数存储不保存对话正文。</text>
<text x="70" y="950" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">工具分支（图 04）：toolCall → Host 策略 → 浏览器虚拟工作区，或 /api/guest/tools/*、/api/guest/mcp/* → toolResult。</text>
<text x="70" y="984" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">普通 Guest ReAct：最多 6 个模型回合、8 次自动工具调用；每个模型回合重新经过 /api/guest/runs 检查并消耗额度。</text>
<text x="60" y="1052" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">浏览器预检帮助用户理解限制；服务端独立执行输入、模型、并发和额度检查。</text>
