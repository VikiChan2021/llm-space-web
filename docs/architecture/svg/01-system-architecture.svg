<text x="60" y="842" font-size="17" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">packages/ui：共享交互与状态；HostServices 负责宿主能力，ModelClient 负责模型目录与连接选择。</text>
<text x="60" y="879" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">packages/core：Thread / Prompt / 转换 / reducer；core/server：Agent 流与服务端存储。packages/runtime：可信宿主的集成与路由。</text>
<text x="60" y="916" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Remote Runtime：Desktop Bun 可切换到 apps/server，再复用 runtime / core；远端连接与请求路径见图 09。</text>
<text x="60" y="1012" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">证据边界：当前源码的组件与连接；没有据此宣称已部署或线上可用。</text>
