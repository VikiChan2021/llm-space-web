</g>
<text x="110" y="824" font-size="19" fill="#111827" font-weight="600" text-anchor="start">结算运行</text>
<text x="80" y="854" font-size="14" fill="#475569" font-weight="400" text-anchor="start">停止循环 → finalizeActiveRun</text>
<text x="80" y="878" font-size="14" fill="#475569" font-weight="400" text-anchor="start">清理状态 / 按结果保存历史</text>
</g>
<text x="60" y="58" font-size="28" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">04  工具调用与 ReAct 循环</text>
<text x="60" y="92" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">模型提出工具请求；共享 Thread store 驱动策略检查、工具执行和下一次模型调用。</text>
<text x="470.0" y="238.0" font-size="14" fill="#9333ea" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-1">AgentEvent</text>
<text x="950.0" y="238.0" font-size="14" fill="#9333ea" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-2">toolCalls</text>
<text x="1420.0" y="238.0" font-size="14" fill="#dc2626" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-3">否</text>
<text x="1204.0" y="400.0" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-4">是：受控调用</text>
<text x="950" y="538" font-size="14" fill="#9333ea" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-5">toolResult</text>
<text x="470" y="538" font-size="14" fill="#9333ea" font-weight="400" text-anchor="middle" data-graph-role="label" data-owner="edge-6">含结果的上下文</text>
<text x="246" y="407" font-size="14" fill="#9333ea" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-7">是：下一回合</text>
<text x="244.0" y="705.0" font-size="14" fill="#dc2626" font-weight="400" text-anchor="start" data-graph-role="label" data-owner="edge-8">否</text>
<text x="540" y="760" font-size="17" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">autoRunTools = false：首轮完成后停止，保留待执行工具调用。</text>
<text x="540" y="805" font-size="16" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">autoRunTools = true、reactLoop = false：自动执行本轮工具，然后停止。</text>
<text x="540" y="850" font-size="16" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">reactLoop = true：工具结果回填后再次请求模型；无工具、失败、中止或限额都会结束。</text>
<text x="540" y="895" font-size="16" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">function stub 需要手填结果；破坏性 Bash 与不满足宿主策略的工具不会自动执行。</text>
<text x="60" y="972" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">图示展开“有待执行工具”的路径；provider-hosted native tools 由供应商执行，不经过 Host executeTool。</text>
<text x="102" y="1018" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">请求 / 主流程</text>
<text x="392" y="1018" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">事件 / 结果 / 循环</text>
<text x="732" y="1018" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">持久化 / 读取</text>
<text x="1052" y="1018" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">检查 / 中止 / 边界</text>
<text x="1680" y="58" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" data-graph-role="label">2026-09-03</text>
</svg>