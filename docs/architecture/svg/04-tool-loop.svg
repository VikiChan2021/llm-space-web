</g>
<text x="1530" y="214" font-size="19" fill="#111827" font-weight="600" text-anchor="start">暂停待审</text>
<text x="1500" y="244" font-size="14" fill="#475569" font-weight="400" text-anchor="start">手动处理 / 补结果</text>
<text x="1500" y="268" font-size="14" fill="#475569" font-weight="400" text-anchor="start">不自动越过限制</text>
</g>
<g id="execute" data-graph-role="node" data-node-id="execute" data-graph-bounds="1020,480,1360,620"><title>Host executeTool — Builtin / MCP / Plugin / 同一批工具 Promise.all / 实际权限由宿主与服务端决定</title>
<rect x="1020" y="480" width="340" height="140" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<g data-graph-role="decoration">
<path d="M 1047,496 l 11,6 v 12 l -11,6 -11,-6 v -12 Z" fill="none" stroke="#2563eb"/>
</g>
<text x="1070" y="514" font-size="19" fill="#111827" font-weight="600" text-anchor="start">Host executeTool</text>
<text x="1040" y="544" font-size="14" fill="#475569" font-weight="400" text-anchor="start">Builtin / MCP / Plugin</text>
<text x="1040" y="568" font-size="14" fill="#475569" font-weight="400" text-anchor="start">同一批工具 Promise.all</text>
<text x="1040" y="592" font-size="14" fill="#475569" font-weight="400" text-anchor="start">实际权限由宿主与服务端决定</text>
</g>
<g id="results" data-graph-role="node" data-node-id="results" data-graph-bounds="540,480,880,620"><title>工具结果入消息 — content + isError + call id / 绑定原 toolCall.output</title>
