</g>
<text x="590" y="214" font-size="19" fill="#111827" font-weight="600" text-anchor="start">reduceMessages</text>
<text x="560" y="244" font-size="14" fill="#475569" font-weight="400" text-anchor="start">assistant.toolCalls</text>
<text x="560" y="268" font-size="14" fill="#475569" font-weight="400" text-anchor="start">工具名 + arguments + call id</text>
</g>
<g id="allow" data-graph-role="node" data-node-id="allow" data-graph-bounds="1020,180,1360,320"><title>允许自动执行？ — 全部工具可执行 / 策略 / 风险 / 调用数</title>
<path d="M 1190.0,180 L 1360,250.0 L 1190.0,320 L 1020,250.0 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="1190.0" y="242.0" font-size="19" fill="#111827" font-weight="600" text-anchor="middle">允许自动执行？</text>
<text x="1190.0" y="267.0" font-size="13" fill="#111827" font-weight="400" text-anchor="middle">全部工具可执行</text>
<text x="1190.0" y="289.0" font-size="13" fill="#111827" font-weight="400" text-anchor="middle">策略 / 风险 / 调用数</text>
</g>
<g id="review" data-graph-role="node" data-node-id="review" data-graph-bounds="1480,180,1680,320"><title>暂停待审 — 手动处理 / 补结果 / 不自动越过限制</title>
<rect x="1480" y="180" width="200" height="140" rx="8" fill="#fef2f2" stroke="#d1d5db" stroke-width="1.5"/>
<g data-graph-role="decoration">
