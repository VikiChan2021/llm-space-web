</g>
<text x="590" y="514" font-size="19" fill="#111827" font-weight="600" text-anchor="start">工具结果入消息</text>
<text x="560" y="544" font-size="14" fill="#475569" font-weight="400" text-anchor="start">content + isError + call id</text>
<text x="560" y="568" font-size="14" fill="#475569" font-weight="400" text-anchor="start">绑定原 toolCall.output</text>
</g>
<g id="repeat" data-graph-role="node" data-node-id="repeat" data-graph-bounds="60,480,400,620"><title>继续回合？ — reactLoop 开启 / 仍在回合上限内</title>
<path d="M 230.0,480 L 400,550.0 L 230.0,620 L 60,550.0 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="230.0" y="542.0" font-size="19" fill="#111827" font-weight="600" text-anchor="middle">继续回合？</text>
<text x="230.0" y="567.0" font-size="13" fill="#111827" font-weight="400" text-anchor="middle">reactLoop 开启</text>
<text x="230.0" y="589.0" font-size="13" fill="#111827" font-weight="400" text-anchor="middle">仍在回合上限内</text>
</g>
<g id="settle" data-graph-role="node" data-node-id="settle" data-graph-bounds="60,790,400,900"><title>结算运行 — 停止循环 → finalizeActiveRun / 清理状态 / 按结果保存历史</title>
<rect x="60" y="790" width="340" height="110" rx="8" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1.5"/>
<g data-graph-role="decoration">
