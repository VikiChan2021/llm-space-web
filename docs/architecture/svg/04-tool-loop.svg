<text x="80" y="244" font-size="14" fill="#475569" font-weight="400" text-anchor="start">准备上下文 → transport → 模型</text>
<text x="80" y="268" font-size="14" fill="#475569" font-weight="400" text-anchor="start">core 的工具执行器返回 terminate</text>
<text x="80" y="292" font-size="14" fill="#475569" font-weight="400" text-anchor="start">真实工具交给宿主执行</text>
</g>
