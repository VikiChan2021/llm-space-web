<text x="60" y="58" font-size="28" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">06  宿主能力矩阵</text>
<text x="60" y="92" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">同一套 ThreadPlayground，根据 HostServices、transport 与服务端策略得到不同能力。</text>
<text x="78" y="191" font-size="16" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">能力 / 数据归属</text>
<text x="328" y="191" font-size="16" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">Desktop Local</text>
<text x="633" y="191" font-size="16" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">Desktop → Remote</text>
<text x="938" y="191" font-size="16" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">Guest Web</text>
<text x="1243" y="191" font-size="16" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">Shared Viewer</text>
<text x="78" y="259" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">运行模型</text>
<text x="328" y="259" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">本机 Provider 连接</text>
<text x="633" y="259" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">远端 Provider 连接</text>
<text x="938" y="259" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Guest API 白名单</text>
<text x="1243" y="259" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">无运行 transport</text>
<text x="78" y="327" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">模型凭据</text>
<text x="328" y="327" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Desktop Bun 管理</text>
<text x="633" y="327" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">远端 runtime 管理</text>
<text x="938" y="327" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Guest 服务端持有</text>
<text x="1243" y="327" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">不需要模型凭据</text>
<text x="78" y="395" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">工具执行</text>
<text x="328" y="395" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Builtin / MCP / Plugin</text>
<text x="633" y="395" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">远端能力约定 / RPC</text>
<text x="938" y="395" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">虚拟工具 + 受限代理</text>
<text x="1243" y="395" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">不可执行</text>
<text x="78" y="463" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">真实文件 / Bash</text>
<text x="328" y="463" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">宿主支持；受策略约束</text>
<text x="633" y="463" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">远端文件与 Shell</text>
<text x="938" y="463" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">不提供真实文件 / Shell</text>
<text x="1243" y="463" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">不可访问</text>
<text x="78" y="531" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">MCP</text>
<text x="328" y="531" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">本机配置与管理</text>
<text x="633" y="531" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">按远端 capabilities</text>
<text x="938" y="531" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">受限 HTTP/MCP；无 stdio</text>
<text x="1243" y="531" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">不可调用</text>
<text x="78" y="599" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">Thread 持久化</text>
<text x="328" y="599" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">本机 workspace / history</text>
<text x="633" y="599" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">远端 workspace / history</text>
<text x="938" y="599" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">浏览器 localStorage</text>
<text x="1243" y="599" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">读取分享 Gist</text>
<text x="78" y="667" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">运行鉴权 / 限制</text>
<text x="328" y="667" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">本机连接配置</text>
<text x="633" y="667" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Bearer + 兼容性协商</text>
<text x="938" y="667" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Guest / IP 额度与并发</text>
<text x="1243" y="667" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">只读分享内容</text>
<text x="78" y="735" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">LangGraph 导出</text>
<text x="328" y="735" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Desktop generator</text>
<text x="633" y="735" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">取决于导出宿主实现</text>
<text x="938" y="735" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">generator = null</text>
<text x="1243" y="735" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">不可导出项目</text>
<text x="60" y="824" font-size="17" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">读取方式：先确定当前宿主，再判断 transport、工具策略、数据归属；界面上出现工具名不代表工具可执行。</text>
<text x="60" y="866" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-graph-role="label">Remote 是 Desktop 选择的执行位置；Cloud identity 是独立身份服务，不能据此推定 Guest 已有账号同步或团队协作。</text>
<text x="60" y="912" font-size="15" fill="#111827" font-weight="600" text-anchor="start" data-graph-role="label">矩阵列出源码能力边界；外部配置、凭据、网络和部署可用性仍需独立验证。</text>
<text x="102" y="958" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">请求 / 主流程</text>
<text x="392" y="958" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">事件 / 结果 / 循环</text>
<text x="732" y="958" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">持久化 / 读取</text>
<text x="1052" y="958" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" data-graph-role="label">检查 / 中止 / 边界</text>
<text x="1540" y="58" font-size="13" fill="#6b7280" font-weight="400" text-anchor="end" data-graph-role="label">2026-09-03</text>
</svg>